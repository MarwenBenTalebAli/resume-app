<div class="education-management">
  <!-- Header -->

  <div class="management-header">
    <div>
      <h2>{{ headerTitle | translate }}</h2>
      <p>{{ headerSubtitle | translate }}</p>
    </div>

    <div class="management-actions">
      <button
        nz-button
        nzType="primary"
        nzSize="large"
        (click)="onNewEducation()"
      >
        <span nz-icon nzType="plus" nzTheme="outline"></span>
        {{ newEducationButtonLabel | translate }}
      </button>

      <button
        nz-button
        nzType="default"
        nzSize="large"
        (click)="onSaveEducationsData()"
      >
        <span nz-icon nzType="save" nzTheme="outline"></span>
        {{ saveDataButtonLabel | translate }}
      </button>

      <button
        nz-button
        nzType="default"
        nzSize="large"
        (click)="onFetchEducationsData()"
      >
        <span nz-icon nzType="cloud-download" nzTheme="outline"></span>
        {{ fetchDataButtonLabel | translate }}
      </button>
    </div>
  </div>

  <!-- Main content -->

  <div class="education-content">

    <!-- Education list -->
    <div class="education-list">

      <div class="section-title">
        <span nz-icon nzType="read" nzTheme="outline"></span>
        <h3>{{ listTitle | translate }}</h3>
      </div>

      <div class="education-items">
        @for (institutEl of instituts; track $index) {
          <app-education-item
            [institut]="institutEl"
            [index]="$index">
          </app-education-item>
        }
      </div>

    </div>

    <!-- Education details -->
    <div class="education-details">

      <div class="section-title">
        <span nz-icon nzType="file-text" nzTheme="outline"></span>
        <h3>{{ detailsTitle | translate }}</h3>
      </div>

      <div class="details-content">
        <router-outlet></router-outlet>
      </div>

    </div>

  </div>

</div>

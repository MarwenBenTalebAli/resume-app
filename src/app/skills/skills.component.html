@if (isAdmin()) {
  <app-skill-list></app-skill-list>
} @else {
  <section
    class="resume-section"
    id="skills"
  >
    <div class="skills-container">

      <!-- Page title -->
      <h2 class="skills-title">
        {{ pageName | translate }}
      </h2>

      <!-- Subtitle -->
      <div class="skills-subtitle">
        {{ subTitle | translate }}
      </div>

      <!-- Skills grid -->
      <div
        nz-row
        [nzGutter]="[16, 16]"
      >
        @for (competence of competences; track $index) {

          <div
            nz-col
            [nzXs]="24"
            [nzSm]="12"
            [nzMd]="8"
            [nzLg]="6"
          >

            <div
              class="skill-card"
              [style.animation-delay]="$index * 0.08 + 's'"
            >

              <!-- Skill icon -->
              <div class="skill-icon">

                <i
                  [innerHTML]="
                    competence?.svg
                      ? sanitizedSvg(
                          competence.svg!,
                          '3em',
                          '3em',
                          'blue',
                          'blue'
                        )
                      : null
                  "
                ></i>

              </div>

              <!-- Skill name -->
              <span class="skill-name">
                {{ competence.nomCompetence }}
              </span>

            </div>

          </div>

        }
      </div>

    </div>
  </section>
}

<div class="skills-management">

  <!-- Header -->

  <div class="management-header">

    <div>
      <h2>{{ headerTitle | translate }}</h2>
      <p>{{ headerSubtitle | translate }}</p>
    </div>

    <div class="management-actions">

      <button
        nz-button
        nzType="primary"
        nzSize="large"
        (click)="onNewCompetence()"
      >
        <span nz-icon nzType="plus" nzTheme="outline"></span>
        {{ newSkillButtonLabel | translate }}
      </button>

      <button
        nz-button
        nzType="default"
        nzSize="large"
        (click)="onSaveCompetencesData()"
      >
        <span nz-icon nzType="save" nzTheme="outline"></span>
        {{ saveDataButtonLabel | translate }}
      </button>

      <button
        nz-button
        nzType="default"
        nzSize="large"
        (click)="onFetchCompetencesData()"
      >
        <span nz-icon nzType="cloud-download" nzTheme="outline"></span>
        {{ fetchDataButtonLabel | translate }}
      </button>

    </div>

  </div>


  <!-- Main content -->

  <div class="skills-content">

    <!-- Skills list -->

    <div class="skills-list">

      <div class="section-title">

        <span
          nz-icon
          nzType="profile"
          nzTheme="outline"
        ></span>

        <h3>
          {{ listTitle | translate }}
        </h3>

      </div>

      <div class="skills-items">

        @for (competenceEl of competences; track $index) {

          <app-skill-item
            [competence]="competenceEl"
            [index]="$index"
          >
          </app-skill-item>

        }

      </div>

    </div>


    <!-- Skill details -->

    <div class="skills-details">

      <div class="section-title">

        <span
          nz-icon
          nzType="file-text"
          nzTheme="outline"
        ></span>

        <h3>
          {{ detailsTitle | translate }}
        </h3>

      </div>

      <div class="details-content">

        <router-outlet></router-outlet>

      </div>

    </div>

  </div>

</div>

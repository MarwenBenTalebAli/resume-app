<a
  [routerLink]="[index()]"
  routerLinkActive="active"
  class="award-item"
>
  <div class="award-item-header">

    <h5 class="award-name">
      {{ formation()?.nomFormation | translateField }}
    </h5>

    <small class="award-dates">
      {{ formation()?.dateDebut }} - {{ formation()?.dateFin }}
    </small>

  </div>

  <p class="award-company">
    {{ formation()?.societe }}
  </p>

  <small class="award-address">
    {{ formation()?.adresse }}
  </small>
</a>

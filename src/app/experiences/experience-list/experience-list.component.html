<div class="experience-management">
  <!-- Header -->

  <div class="management-header">
    <div>
      <h2>{{ headerTitle | translate }}</h2>
      <p>{{ headerSubtitle | translate }}</p>
    </div>

    <div class="management-actions">
      <button
        nz-button
        nzType="primary"
        nzSize="large"
        (click)="onNewExperience()"
      >
        <span nz-icon nzType="plus" nzTheme="outline"></span>
        {{ newExperienceButtonLabel | translate }}
      </button>

      <button
        nz-button
        nzType="default"
        nzSize="large"
        (click)="onSaveExperiencesData()"
      >
        <span nz-icon nzType="save" nzTheme="outline"></span>
        {{ saveDataButtonLabel | translate }}
      </button>

      <button
        nz-button
        nzType="default"
        nzSize="large"
        (click)="onFetchExperiencesData()"
      >
        <span nz-icon nzType="cloud-download" nzTheme="outline"></span>
        {{ fetchDataButtonLabel | translate }}
      </button>
    </div>
  </div>

  <!-- Main content -->

  <div class="experience-content">
    <!-- Experiences list -->

    <div class="experience-list">
      <div class="section-title">
        <div class="section-title-main">
          <span nz-icon nzType="profile" nzTheme="outline"></span>

          <h3>
            {{ listTitle | translate }}
          </h3>
        </div>

        @if (selectedExperience) {
          <div class="selected-experience-title">
            <span nz-icon nzType="check-circle" nzTheme="outline"></span>

            <span>
              {{ selectedExperience.nomExperience | translateField }}
            </span>
          </div>
        }
      </div>

      <div class="experience-items">
        @for (experienceEl of experiences; track $index) {
          <app-experience-item [experience]="experienceEl" [index]="$index">
          </app-experience-item>
        }
      </div>
    </div>

    <!-- Experience details -->

    <div class="experience-details">
      <div class="section-title">
        <div class="section-title-main">
          <span nz-icon nzType="file-text" nzTheme="outline"></span>

          <h3>
            {{ detailsTitle | translate }}
          </h3>
        </div>
      </div>

      <div class="details-content">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</div>

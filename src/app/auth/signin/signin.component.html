<div class="signin-page">
  <div class="signin-wrapper">
    <div class="signin-card">
      <div class="signin-header">
        <div class="signin-icon">
          <span nz-icon nzType="lock" nzTheme="outline"></span>
        </div>

        <h1>Admin Sign In</h1>
		<p>Sign in to manage your portfolio</p>
      </div>

      <form nz-form (ngSubmit)="onSignin(f)" #f="ngForm">
        <!-- Email -->
        <nz-form-item>
          <nz-form-label [nzSpan]="24" nzFor="email"> Email </nz-form-label>

          <nz-form-control [nzSpan]="24">
            <nz-input-group nzPrefixIcon="mail">
              <input
                nz-input
                type="email"
                id="email"
                name="email"
                ngModel
                required
                email
                placeholder="Enter your email"
              />
            </nz-input-group>
          </nz-form-control>
        </nz-form-item>

        <!-- Password -->
        <nz-form-item>
          <nz-form-label [nzSpan]="24" nzFor="password">
            Password
          </nz-form-label>

          <nz-form-control [nzSpan]="24">
            <nz-input-group nzPrefixIcon="lock">
              <input
                nz-input
                type="password"
                id="password"
                name="password"
                ngModel
                required
                placeholder="Enter your password"
              />
            </nz-input-group>
          </nz-form-control>
        </nz-form-item>

        <!-- Error -->
        @if (errorAlert) {
          <nz-alert
            nzType="error"
            [nzMessage]="errorAlert"
            nzShowIcon
            class="signin-error"
          >
          </nz-alert>
        }

        <!-- Submit -->
        <button
          nz-button
          nzType="primary"
          nzSize="large"
          nzBlock
          type="submit"
          [disabled]="!f.valid"
          class="signin-button"
        >
          <span nz-icon nzType="login" nzTheme="outline"></span>
          Sign In
        </button>
      </form>
    </div>

  </div>
</div>
